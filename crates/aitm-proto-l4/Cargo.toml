[package]
name = "aitm-proto-l4"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authorized raw-L4 / packet MITM: capture, scapy-style craft + guarded inject, send-recv, and in-path packet interception behind a deny-by-default L4Guard."

[dependencies]
# The command surface (M5 Task 9) is built on the core `Plugin` + `Command`
# seams; L4 is command-driven, not acceptor-driven, so it needs `aitm-core`
# (Command/Plugin/CommandHost/ParamSchema/Value/Registry) but not `aitm-plugin`
# (the ProtocolModule acceptor seam).
aitm-core.workspace = true
# `Command::invoke` returns `anyhow::Result<Value>`.
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
# The command layer bridges a transport-neutral `Value` craft spec / scope entry
# into the serde-derived `PacketSpec` / `L4ScopeEntry`, and round-trips the
# uuid-backed `L4ScopeId` / `L4FlowId` as strings on the bus (the reason Task 1/3
# derive serde on the ids). No new major version: serde_json is already resolved
# in the workspace lock via aitm-mcp / aitm-poc.
serde_json = "1"
# L4ScopeId is uuid-backed; the `serde` feature lets scope ids round-trip in
# config / command payloads. `v4` comes from the workspace definition.
uuid = { workspace = true, features = ["serde"] }
# Craft (M5 Task 2). `pnet_packet` is the verbatim field-level builder — every
# header field is settable, so deliberately-malformed packets are expressible
# (research note 08). `etherparse` is the structural parser used by `summarize`.
# Versions pinned from research note 08 (etherparse 0.21, pnet_packet 0.35).
pnet_packet = "0.35"
etherparse = "0.21"
# Typed `CraftError`. `2` matches the thiserror already resolved in the workspace
# lock, so no second major version enters the tree. (Task 4 also depends on
# `thiserror` for `L4GuardError` — a trivial Cargo.toml merge at integration,
# flagged in the Task 2 handover.)
thiserror = "2"
# Wire backend (M5 Task 6): libpcap bindings for L2 capture + inject
# (`Capture::sendpacket`), the same code path on macOS and Linux. Version pinned
# from research note 08 (pcap 2.5.0, best-maintained of the group). libpcap ships
# with macOS; Linux needs `libpcap-dev`. The crate's own `unsafe` stays internal —
# the aitm-proto-l4 crate root keeps `#![forbid(unsafe_code)]` (AC20).
pcap = "2.5"

# In-path interception (M5 Task 11): Linux NFQUEUE. `nfq` talks netlink directly
# (no GPL `libnetfilter_queue` link), its public API is safe `fn`s so the crate
# root keeps `#![forbid(unsafe_code)]` (its own `unsafe` stays internal), and a
# `Message` holds an `Arc` of the recv buffer with no lifetime, so a parked packet
# can be verdicted later — exactly the park/mutate/forward model M5 needs. Version
# pinned from research note 09 (nfq 0.2.5). Linux-only: NFQUEUE has no macOS
# equivalent, so the dep is behind a target cfg and `l4.intercept.*` returns
# `L4Unavailable` on every other OS.
[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2.5"

[dev-dependencies]
# config is authored as YAML by the operator; the deserialization test parses it.
serde_yaml = "0.9"
# The command tests build a core `CommandHost`, whose `ProxyClient` seam returns a
# `BoxFuture`; the stub client needs `futures`.
futures.workspace = true

[lints]
workspace = true
