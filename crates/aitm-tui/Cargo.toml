[package]
name = "aitm-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "aitmproxy terminal operator UI (ratatui): a command-bus client for macOS and Linux."
build = "build.rs"

[lib]
name = "aitm_tui"
path = "src/lib.rs"

[[bin]]
name = "aitm-tui"
path = "src/main.rs"

[dependencies]
aitm-bus-client.workspace = true
anyhow.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures.workspace = true
# Filter regexes (`~u /re/`); already in Cargo.lock via tracing-subscriber.
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: a body viewer must show JSON keys in wire order.
serde_json = { version = "1", features = ["preserve_order"] }
# The L4 craft editor authors a PacketSpec as human-friendly YAML (ui-ext §3.2).
serde_yaml = "0.9"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
unicode-width = "0.2"

[build-dependencies]
serde_json = "1"

[lints]
workspace = true
