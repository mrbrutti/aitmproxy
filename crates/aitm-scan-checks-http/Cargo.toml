[package]
name = "aitm-scan-checks-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scanner v2 native HTTP checks (track T3): checks contributed to the HTTP lane's catalogue. Skeleton slot handed over at T1a."

[dependencies]
# The `Check` trait this crate's `checks_with()` slot returns. This crate contributes
# native checks to the HTTP lane's catalogue; it is not a lane of its own (A16).
aitm-scan-model.workspace = true
# `redact::scrub_text`, which every excerpt passes through before it reaches an
# `Evidence` (spec D8.1, "Redaction"), and `Authority`, the one authority
# normalisation the raw-h2 origin gate keys on.
aitm-core.workspace = true
# `Assertion` and `Severity`: a check's PoC hint speaks the PoC engine's
# matcher vocabulary rather than minting a parallel one (spec D6).
aitm-poc.workspace = true
# The h2 sender and raw-h2 codec the observe-only h2 checks drive (spec D8.2).
aitm-proto-http.workspace = true
# The raw h2 runner's fallible result; no check body returns one.
anyhow.workspace = true
# `BoxFuture`: the `Check` trait is object-safe, so every check body is boxed.
futures.workspace = true
# One `debug!` line: a raw h2 probe that did not complete.
tracing.workspace = true

[dev-dependencies]
# The `Check` bodies are async; their unit tests drive them on a current-thread
# runtime with time paused, never a real clock (spec D4, "Timing without sleep").
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "test-util",
] }
# Only the tests compile a regex: the checks carry the open-redirect PoC
# matcher as a string for the PoC engine to compile, and the tests check that
# it says what it means.
regex.workspace = true
# The REAL Rhai bridge. `tests/rhai_harness/` loads the shipped
# `scripts/bundled/active/*.rhai` through `RhaiLoader` and runs the
# `ScriptCheck` the bridge registered, so the bundled checks are tested on the
# engine that ships rather than on a stand-in (T3 plan Task 11, decision
# D-2b-1). No cycle: `aitm-plugin-rhai` does not depend on this crate.
aitm-plugin-rhai.workspace = true
# `testing::RecordingHost`, the reply table those script checks probe against.
# The crate already depends on `aitm-scan-model`; this adds only the feature.
aitm-scan-model = { workspace = true, features = ["testing"] }

[lints]
workspace = true
