[package]
name = "aitm-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP frontend: derives an MCP tool per registered command; stdio and loopback-TCP transports."

[dependencies]
aitm-core.workspace = true
anyhow.workspace = true
serde_json = "1"
uuid.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "net", "rt", "sync"] }

[dev-dependencies]
aitm-plugins.workspace = true
aitm-poc.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
