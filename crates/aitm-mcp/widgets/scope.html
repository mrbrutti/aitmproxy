/* component styles below use ONLY var(--…) — no hex */
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--color-ground-page);color:var(--color-text-primary);font-size:var(--font-size-sm,14px)}
main{padding:var(--space-4,16px)}

.hdr{display:flex;align-items:baseline;gap:var(--space-3,12px);margin-bottom:var(--space-4,16px)}
.hdr h1{margin:0;font-size:var(--font-size-md,16px);font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary)}
.hdr .sum{color:var(--color-text-secondary);font-size:var(--font-size-sm,14px)}

.card{background:var(--color-ground-surface);border:1px solid var(--color-line-border);border-radius:var(--radius-md,8px);padding:var(--space-4,16px);margin-bottom:var(--space-4,16px)}

.sec-head{display:flex;align-items:center;gap:var(--space-2,8px);margin-bottom:var(--space-3,12px)}
.sec-head h2{margin:0;font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-tertiary)}
.count{color:var(--color-text-secondary);font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500)}
.note{margin:0 0 var(--space-3,12px);color:var(--color-text-tertiary);font-size:var(--font-size-xs,12px)}

.chips{display:flex;flex-wrap:wrap;gap:var(--space-2,8px)}

/* in-scope entries: accent-tinted mono chips */
.chip{font-family:var(--font-data);font-size:var(--font-size-sm,14px);line-height:1.5;padding:var(--space-1,4px) var(--space-3,12px);border-radius:var(--radius-full,999px);border:1px solid transparent;white-space:nowrap}
.chip.scope{background:var(--color-accent-tint);color:var(--color-accent-deep);border-color:var(--color-accent-base)}

/* passthrough entries: tunnelled (not decrypted) — muted, dashed outline to distinguish */
.chip.pass{background:var(--color-ground-raised);color:var(--color-text-secondary);border:1px dashed var(--color-line-control)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full,999px);font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500);line-height:1.5}
.badge.tunnel{background:var(--color-ground-raised);color:var(--color-text-tertiary);border:1px dashed var(--color-line-control)}

.empty{padding:var(--space-6,24px);text-align:center;color:var(--color-text-tertiary)}
</style>

<body>
<main id="app"></main>
<script>
// ——— shared runtime (keep in sync across widgets) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);
// ——— widget render (unique per widget) ———
// MV3 fallback-proof: accept a top-level array AND an object-wrapped shape.
function scopeRows(data){
  return Array.isArray(data) ? data : ((data && (data.entries || data.scope)) || []);
}
function passthroughFrom(data){
  if (!data || Array.isArray(data)) return [];
  const p = data.passthrough || data.tls_passthrough || data.passthrough_hosts;
  return Array.isArray(p) ? p : [];
}
// Passthrough hosts can arrive via a secondary bridge call (see fetchPassthrough).
let fetchedPass = null;

function hostList(rows, cls, emptyMsg){
  if (!rows || rows.length === 0) return empty(emptyMsg);
  const wrap = el('div', { class: 'chips' });
  for (const h of rows) wrap.append(el('span', { class: 'chip ' + cls, text: String(h) }));
  return wrap;
}

function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  const scope = scopeRows(data);
  const pass = (fetchedPass != null) ? fetchedPass : passthroughFrom(data);

  app.append(
    el('div', { class: 'hdr' },
      el('h1', { text: 'Scope' }),
      el('span', { class: 'sum', text: scope.length + ' in scope · ' + pass.length + ' passthrough' })
    )
  );

  const scopeCard = el('div', { class: 'card' });
  scopeCard.append(
    el('div', { class: 'sec-head' },
      el('h2', { text: 'In scope' }),
      el('span', { class: 'count', text: String(scope.length) })
    ),
    el('p', { class: 'note', text: 'Hosts eligible for active actions. Deny-by-default; everything else is out of scope.' }),
    hostList(scope, 'scope', 'No hosts in scope.')
  );
  app.append(scopeCard);

  const passCard = el('div', { class: 'card' });
  passCard.append(
    el('div', { class: 'sec-head' },
      el('h2', { text: 'TLS passthrough' }),
      el('span', { class: 'count', text: String(pass.length) }),
      badge('tunnel', 'tunnelled')
    ),
    el('p', { class: 'note', text: 'Pinned hosts tunnelled byte-for-byte — not decrypted, not captured.' }),
    hostList(pass, 'pass', 'No passthrough hosts — all in-scope TLS is decrypted.')
  );
  app.append(passCard);
}

// Secondary MCP Apps bridge call to tls.passthrough.list (best-effort, "when provided").
function fetchPassthrough(){
  const fn = openai && (openai.callTool || openai.callServerTool);
  if (typeof fn !== 'function') return;
  let p;
  try { p = fn.call(openai, 'tls.passthrough.list', {}); } catch (_) { return; }
  if (!p || typeof p.then !== 'function') return;
  p.then(function(res){
    const sc = (res && res.structuredContent != null) ? res.structuredContent : res;
    const rows = Array.isArray(sc) ? sc : ((sc && (sc.entries || sc.hosts || sc.passthrough)) || []);
    if (Array.isArray(rows)) { fetchedPass = rows; render(); }
  }).catch(function(){});
}

render();
fetchPassthrough();
window.addEventListener?.('openai:set_globals', render);
</script>
