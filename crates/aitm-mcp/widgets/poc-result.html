<body>
<main id="app"></main>
<script>
// ——— shared runtime (keep in sync across widgets) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);
// ——— widget render (unique per widget) ———
const SEVERITIES = { critical: 1, high: 1, medium: 1, low: 1, info: 1 };
function sevClass(s){ const k = String(s || '').toLowerCase(); return 'sev-' + (SEVERITIES[k] ? k : 'info'); }
function str(v){ return (v == null) ? '' : String(v); }
function nonEmpty(v){ const s = str(v).trim(); return s.length ? s : null; }

function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  if (!data || typeof data !== 'object' || Array.isArray(data) || Object.keys(data).length === 0){
    app.append(empty('No PoC result yet.'));
    return;
  }

  const passed = data.passed === true;

  // Header
  const head = el('div', { class: 'head' });
  head.append(el('span', { class: 'title', text: 'PoC result' }));
  const origin = nonEmpty(data.origin);
  const at = nonEmpty(data.at);
  const subParts = [];
  if (origin) subParts.push('origin ' + origin);
  if (at) subParts.push(at);
  if (subParts.length) head.append(el('span', { class: 'sub', text: subParts.join(' · ') }));
  app.append(head);

  // Pass/fail banner
  const banner = el('div', { class: 'banner ' + (passed ? 'pass' : 'fail') });
  banner.append(el('span', { class: 'verdict', text: passed ? 'PASS' : 'FAIL' }));
  banner.append(el('span', { class: 'vsum', text: passed ? 'PoC reproduced the finding' : 'PoC did not reproduce the finding' }));
  app.append(banner);

  // Severity + target meta
  const severity = nonEmpty(data.severity);
  const target = nonEmpty(data.target);
  if (severity || target){
    const meta = el('div', { class: 'card meta' });
    if (severity){
      const f = el('div', { class: 'field' });
      f.append(el('span', { class: 'label', text: 'Severity' }));
      f.append(badge(sevClass(severity), String(severity).toLowerCase()));
      meta.append(f);
    }
    if (target){
      const f = el('div', { class: 'field' });
      f.append(el('span', { class: 'label', text: 'Target' }));
      f.append(el('span', { class: 'mono', text: target }));
      meta.append(f);
    }
    app.append(meta);
  }

  // Produced artifacts
  const artifacts = [
    { name: 'Flow capture', type: 'flow', value: nonEmpty(data.finding_capture) },
    { name: 'PoC definition', type: 'yaml', value: nonEmpty(data.poc_path) },
    { name: 'Screenshot', type: 'png', value: nonEmpty(data.screenshot_path) },
    { name: 'Finding record', type: 'finding', value: nonEmpty(data.recorded_id) },
  ].filter(a => a.value);
  const artCard = el('div', { class: 'card' });
  artCard.append(el('div', { class: 'section-title', text: 'Artifacts' }));
  if (artifacts.length){
    const tbl = el('table', { class: 'tbl' });
    const thead = el('thead');
    thead.append(el('tr', null,
      el('th', { text: 'Artifact' }),
      el('th', { text: 'Type' }),
      el('th', { text: 'Location' })));
    tbl.append(thead);
    const tbody = el('tbody');
    for (const a of artifacts){
      const tr = el('tr');
      tr.append(el('td', { text: a.name }));
      tr.append(el('td', null, badge('atype', a.type)));
      tr.append(el('td', null, el('span', { class: 'mono', text: a.value })));
      tbody.append(tr);
    }
    tbl.append(tbody);
    artCard.append(tbl);
  } else {
    artCard.append(empty('No artifacts were produced.'));
  }
  app.append(artCard);

  // Per-assertion breakdown
  const evaluated = Array.isArray(data.evaluated) ? data.evaluated : [];
  if (evaluated.length){
    const card = el('div', { class: 'card' });
    card.append(el('div', { class: 'section-title', text: 'Assertions' }));
    const tbl = el('table', { class: 'tbl' });
    const thead = el('thead');
    thead.append(el('tr', null,
      el('th', { text: 'Assertion' }),
      el('th', { text: 'Result' })));
    tbl.append(thead);
    const tbody = el('tbody');
    for (const o of evaluated){
      const matched = o && o.matched === true;
      const tr = el('tr');
      tr.append(el('td', null, el('span', { class: 'mono', text: str(o && o.assertion) })));
      tr.append(el('td', null, el('span', { class: matched ? 'st-pass' : 'st-fail', text: matched ? 'matched' : 'no match' })));
      tbody.append(tr);
    }
    tbl.append(tbody);
    card.append(tbl);
    app.append(card);
  }
}
render();
window.addEventListener?.('openai:set_globals', render);
</script>
</body>
</html>
