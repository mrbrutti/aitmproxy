/* component styles below use ONLY var(--…) — no hex */
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--color-ground-page);color:var(--color-text-primary);font-size:var(--font-size-sm,14px)}
main{padding:var(--space-4,16px)}
.card{background:var(--color-ground-surface);border:1px solid var(--color-line-border);border-radius:var(--radius-md,8px)}
.hdr{display:flex;align-items:baseline;gap:var(--space-2,8px);margin-bottom:var(--space-4,16px)}
.hdr h1{margin:0;font-size:var(--font-size-md,16px);font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary)}
.hdr .sum{font-size:var(--font-size-sm,14px);color:var(--color-text-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-3,12px)}
.tile{padding:var(--space-3,12px) var(--space-4,16px)}
.tile-label{font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-tertiary)}
.tile-value{margin-top:var(--space-2,8px);font-size:var(--font-size-lg,20px);font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary);line-height:1.2}
.tile-sub{margin-top:var(--space-1,4px);font-size:var(--font-size-xs,12px);color:var(--color-text-secondary)}
.mono{font-family:var(--font-data)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-full,999px);font-size:var(--font-size-sm,14px);font-weight:var(--font-weight-medium,500);line-height:1.6;background:var(--color-ground-raised)}
.badge .dot{width:8px;height:8px;border-radius:var(--radius-full,999px);background:currentColor}
.on{color:var(--color-status-success)}
.off{color:var(--color-status-killed)}
.armed{color:var(--color-intercept-deep);background:var(--color-intercept-tint)}
.num-hot{color:var(--color-intercept-deep)}
.num-zero{color:var(--color-text-tertiary)}
.empty{padding:var(--space-6,24px);text-align:center;color:var(--color-text-tertiary)}
</style>

<body>
<main id="app"></main>
<script>
// ——— shared runtime (keep in sync across widgets) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);
// ——— widget render (unique per widget) ———
function count(n){ return (typeof n === 'number' && isFinite(n)) ? Math.trunc(n) : 0; }
function stateBadge(on, onLabel, offLabel){
  const b = el('span', { class: 'badge ' + (on ? 'on' : 'off') });
  b.append(el('span', { class: 'dot' }));
  b.append(document.createTextNode(on ? onLabel : offLabel));
  return b;
}
function tile(label, valueNode, subNode){
  const t = el('div', { class: 'card tile' });
  t.append(el('div', { class: 'tile-label', text: label }));
  t.append(el('div', { class: 'tile-value' }, valueNode));
  if (subNode != null) t.append(subNode);
  return t;
}
function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  if (data == null || typeof data !== 'object'){ app.append(empty('No proxy status available.')); return; }

  const listening = data.listening === true;
  const armed = data.intercept_armed === true;
  const capturing = data.capturing === true;
  const parked = count(data.paused);
  const flows = count(data.flows);
  const address = (typeof data.address === 'string' && data.address) ? data.address : null;

  const hdr = el('div', { class: 'hdr' });
  hdr.append(el('h1', { text: 'Proxy status' }));
  hdr.append(el('span', { class: 'sum', text: listening ? 'listening' : 'not listening' }));
  app.append(hdr);

  const grid = el('div', { class: 'grid' });

  // Listening (with address, mono)
  const addrSub = el('div', { class: 'tile-sub mono', text: address || '—' });
  grid.append(tile('Listening', stateBadge(listening, 'Listening', 'Offline'), addrSub));

  // Capturing
  grid.append(tile('Capturing', stateBadge(capturing, 'On', 'Off')));

  // Intercept armed — intercept palette when armed
  const interceptBadge = armed
    ? badge('armed', 'Armed')
    : stateBadge(false, 'Armed', 'Disarmed');
  grid.append(tile('Intercept', interceptBadge));

  // Parked (paused) flow count
  const parkedNum = el('span', { class: parked > 0 ? 'num-hot' : 'num-zero', text: String(parked) });
  grid.append(tile('Parked flows', parkedNum));

  // Visible flow count
  const flowsNum = el('span', { class: flows > 0 ? '' : 'num-zero', text: String(flows) });
  grid.append(tile('Visible flows', flowsNum));

  app.append(grid);
}
render();
window.addEventListener?.('openai:set_globals', render);
</script>
