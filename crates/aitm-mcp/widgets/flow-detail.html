<script>
// ——— shared runtime (identical in every widget) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);

// ——— widget helpers (unique per widget) ———
function methodClass(method){
  const m = String(method || '').toLowerCase();
  const known = ['get','post','put','patch','delete','head','options','connect','ws'];
  return known.includes(m) ? ('m-' + m) : 'm-unknown';
}
function statusClass(status){
  const n = Number(status);
  if (!Number.isFinite(n)) return 'st-pending';
  if (n >= 100 && n < 200) return 'st-1xx';
  if (n >= 200 && n < 300) return 'st-2xx';
  if (n >= 300 && n < 400) return 'st-3xx';
  if (n >= 400 && n < 500) return 'st-4xx';
  if (n >= 500 && n < 600) return 'st-5xx';
  return 'st-pending';
}
function b64ToBytes(s){
  if (typeof atob !== 'function') return new Uint8Array(0);
  const bin = atob(String(s));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function decodeBody(b64){
  try {
    const bytes = b64ToBytes(b64);
    const txt = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    return { txt, bytes };
  } catch (e) { return null; }
}
function isBinary(txt){
  let bad = 0;
  const n = Math.min(txt.length, 2048);
  for (let i = 0; i < n; i++){
    const c = txt.charCodeAt(i);
    if (c === 0xFFFD || c < 9 || (c > 13 && c < 32)) bad++;
  }
  return n > 0 && bad / n > 0.1;
}
// Cheap JSON-ish token tinting — not a parser; non-JSON text falls through as plain mono.
function tintBody(container, text){
  const re = /("(?:[^"\\]|\\.)*"\s*(?=:))|("(?:[^"\\]|\\.)*")|(\btrue\b|\bfalse\b|\bnull\b)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([{}\[\]])|([,:])/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) container.append(document.createTextNode(text.slice(last, m.index)));
    let cls = 'syn-punct';
    if (m[1]) cls = 'syn-key';
    else if (m[2]) cls = 'syn-string';
    else if (m[3]) cls = 'syn-boolean';
    else if (m[4]) cls = 'syn-number';
    else if (m[5]) cls = 'syn-bracket';
    container.append(el('span', { class: cls, text: m[0] }));
    last = re.lastIndex;
  }
  if (last < text.length) container.append(document.createTextNode(text.slice(last)));
}
function bodyBlock(section){
  const size = section.body_size;
  const b64 = section.body;
  if (b64 == null){
    if (typeof size === 'number' && size > 0) return empty('Body not included (' + size + ' bytes)');
    return empty('No body');
  }
  const parsed = decodeBody(b64);
  if (!parsed) return empty('Body unavailable');
  if (parsed.bytes.length === 0) return empty('Empty body');
  if (isBinary(parsed.txt)) return empty('Binary body (' + parsed.bytes.length + ' bytes)');
  const pre = el('div', { class: 'body mono' });
  tintBody(pre, parsed.txt);
  const wrap = el('div');
  wrap.append(pre);
  if (section.body_truncated) wrap.append(el('div', { class: 'bodynote', text: 'truncated' }));
  return wrap;
}
function headersTable(headers){
  const rows = Array.isArray(headers) ? headers : [];
  if (!rows.length) return empty('No headers');
  const tbody = el('tbody');
  for (const pair of rows){
    const name = Array.isArray(pair) ? pair[0] : '';
    const value = Array.isArray(pair) ? pair[1] : '';
    tbody.append(el('tr', null,
      el('td', { class: 'hname' }, name),
      el('td', { class: 'mono hval' }, value)));
  }
  return el('table', { class: 'tbl' },
    el('thead', null, el('tr', null, el('th', { text: 'Name' }), el('th', { text: 'Value' }))),
    tbody);
}
function timingLine(data){
  const meta = data.meta || {};
  const cc = data.client_conn || {};
  const sc = data.server_conn;
  const parts = [];
  if (meta.duration_ms != null) parts.push(meta.duration_ms + ' ms');
  if (meta.created) parts.push(meta.created);
  if (data.intercept) parts.push('intercept: ' + data.intercept);
  if (data.edited) parts.push('edited');
  if (meta.is_replay) parts.push('replay');
  if (Array.isArray(meta.marks) && meta.marks.length) parts.push('marks: ' + meta.marks.join(', '));
  if (cc.peer) parts.push('client ' + cc.peer);
  if (sc && sc.peer) parts.push('server ' + sc.peer);
  if (cc.tls) parts.push('TLS' + (cc.alpn ? ' ' + cc.alpn : ''));
  if (cc.sni) parts.push('SNI ' + cc.sni);
  if (!parts.length) return empty('No connection info');
  const line = el('div', { class: 'meta' });
  parts.forEach((p, i) => {
    if (i) line.append(el('span', { class: 'sep', text: '·' }));
    line.append(el('span', { text: p }));
  });
  return line;
}
function httpSection(title, line, headers, bodySec){
  const card = el('section', { class: 'card sect' });
  const head = el('div', { class: 'secthead' }, el('span', { class: 'secttitle', text: title }));
  if (line) head.append(line);
  card.append(head);
  card.append(el('div', { class: 'subhead', text: 'Headers' }));
  card.append(headersTable(headers));
  card.append(el('div', { class: 'subhead', text: 'Body' }));
  card.append(bodySec);
  return card;
}
function renderHttp(app, data){
  const req = data.request || {};
  const resp = data.response;
  const head = el('div', { class: 'flowhead' });
  head.append(badge(methodClass(req.method), String(req.method || '—')));
  const url = (req.scheme ? req.scheme + '://' : '') + (req.authority || '') + (req.path || '');
  head.append(el('span', { class: 'url mono', text: url || '—' }));
  if (resp && resp.status != null) head.append(el('span', { class: 'badge ' + statusClass(resp.status), text: String(resp.status) }));
  app.append(head);
  app.append(timingLine(data));
  app.append(httpSection('Request',
    el('span', { class: 'reqline mono', text: [req.method, req.path, req.version].filter(Boolean).join(' ') }),
    req.headers, bodyBlock(req)));
  if (resp){
    app.append(httpSection('Response',
      el('span', { class: 'reqline mono', text: [resp.version, resp.status != null ? String(resp.status) : null].filter(Boolean).join(' ') }),
      resp.headers, bodyBlock(resp)));
  } else {
    const card = el('section', { class: 'card sect' });
    card.append(el('div', { class: 'secthead' }, el('span', { class: 'secttitle', text: 'Response' })));
    card.append(empty('No response'));
    app.append(card);
  }
}
function renderWs(app, data){
  const head = el('div', { class: 'flowhead' });
  head.append(badge('m-ws', 'WS'));
  head.append(el('span', { class: 'url mono', text: String(data.handshake || '—') }));
  app.append(head);
  app.append(timingLine(data));
  const card = el('section', { class: 'card sect' });
  card.append(el('div', { class: 'secthead' }, el('span', { class: 'secttitle', text: 'Messages' })));
  const msgs = Array.isArray(data.messages) ? data.messages : [];
  if (!msgs.length){ card.append(empty('No messages')); app.append(card); return; }
  for (const m of msgs){
    const dir = m.dir === 'client_to_server' ? '→' : (m.dir === 'server_to_client' ? '←' : '·');
    const row = el('div', { class: 'msg' },
      el('span', { class: 'msgdir mono', text: dir }),
      badge('m-ws', String(m.opcode || '')),
      el('span', { class: 'meta', text: [m.length != null ? m.length + ' bytes' : null, m.injected ? 'injected' : null, m.timestamp || null].filter(Boolean).join(' · ') }));
    card.append(row);
    card.append(bodyBlock({ body: m.data, body_size: m.length, body_truncated: false }));
  }
  app.append(card);
}
// ——— widget render ———
function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  if (!data || (data.kind == null && data.request == null && data.messages == null)){
    app.append(empty('No flow selected'));
    return;
  }
  if (data.kind === 'websocket') renderWs(app, data);
  else renderHttp(app, data);
}
render();
window.addEventListener?.('openai:set_globals', render);
</script>
