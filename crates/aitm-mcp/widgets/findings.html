/* component styles below use ONLY var(--…) — no hex */
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--color-ground-page);color:var(--color-text-primary);font-size:var(--font-size-sm,14px)}
main{padding:var(--space-4,16px)}
.header{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3,12px);margin-bottom:var(--space-3,12px)}
.header .title{font-size:var(--font-size-md,15px);font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary)}
.header .count{font-size:var(--font-size-xs,12px);color:var(--color-text-secondary)}
.card{background:var(--color-ground-surface);border:1px solid var(--color-line-border);border-radius:var(--radius-md,8px);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:var(--font-size-sm,14px)}
.tbl th{text-align:left;padding:var(--space-2,8px) var(--space-3,12px);color:var(--color-text-tertiary);font-weight:var(--font-weight-medium,500);text-transform:uppercase;letter-spacing:.04em;font-size:var(--font-size-xs,12px)}
.tbl td{padding:var(--space-2,8px) var(--space-3,12px);border-top:1px solid var(--color-line-rule);vertical-align:top}
.tbl tbody tr:hover{background:var(--color-ground-hover)}
.tbl td.title{color:var(--color-text-primary);font-weight:var(--font-weight-medium,500)}
.tbl td.when{color:var(--color-text-secondary);white-space:nowrap}
.mono{font-family:var(--font-data);color:var(--color-text-secondary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full,999px);font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500);line-height:1.5;text-transform:capitalize}
.sev-critical{background:var(--color-severity-critical-bg);color:var(--color-severity-critical-fg)}
.sev-high{background:var(--color-severity-high-bg);color:var(--color-severity-high-fg)}
.sev-medium{background:var(--color-severity-medium-bg);color:var(--color-severity-medium-fg)}

</style>

<body>
<main id="app"></main>
<script>
// ——— shared runtime (identical in every widget) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);
// ——— widget render (unique per widget) ———
const SEV_RANK = { critical: 4, high: 3, medium: 2, low: 1, info: 0 };
function sevKey(f){ return String(f && f.severity || '').toLowerCase(); }
function sevClass(key){ return Object.prototype.hasOwnProperty.call(SEV_RANK, key) ? ('sev-' + key) : 'sev-info'; }
function sevLabel(key){ return key || 'info'; }
function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  const rows = Array.isArray(data) ? data : (data.findings || []);
  const header = el('div', { class: 'header' },
    el('span', { class: 'title', text: 'Findings' }),
    el('span', { class: 'count', text: rows.length + (rows.length === 1 ? ' finding' : ' findings') }));
  app.append(header);
  if (!rows.length){
    app.append(empty('No findings recorded.'));
    return;
  }
  const sorted = rows.slice().sort((a, b) => (SEV_RANK[sevKey(b)] ?? -1) - (SEV_RANK[sevKey(a)] ?? -1));
  const thead = el('thead', null, el('tr', null,
    el('th', { text: 'Severity' }),
    el('th', { text: 'Title' }),
    el('th', { text: 'Class' }),
    el('th', { text: 'Target' }),
    el('th', { text: 'When' })));
  const tbody = el('tbody');
  for (const f of sorted){
    const key = sevKey(f);
    tbody.append(el('tr', null,
      el('td', null, badge(sevClass(key), sevLabel(key))),
      el('td', { class: 'title', text: f.title || '' }),
      el('td', { text: f.class || '' }),
      el('td', { class: 'mono', text: f.target || '' }),
      el('td', { class: 'when', text: f.discovered_at || f.when || '' })));
  }
  app.append(el('div', { class: 'card' }, el('table', { class: 'tbl' }, thead, tbody)));
}
render();
window.addEventListener?.('openai:set_globals', render);
</script>
