/* component styles below use ONLY var(--…) — no hex */
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--color-ground-page);color:var(--color-text-primary);font-size:var(--font-size-sm,14px)}
main{padding:var(--space-4,16px)}

/* header */
.head{display:flex;align-items:baseline;gap:var(--space-2,8px);padding:0 var(--space-1,4px) var(--space-3,12px)}
.head h1{margin:0;font-size:var(--font-size-md,16px);font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary);letter-spacing:-.01em}
.head .count{color:var(--color-text-secondary);font-size:var(--font-size-sm,14px)}

/* card */
.card{background:var(--color-ground-surface);border:1px solid var(--color-line-border);border-radius:var(--radius-md,8px);overflow:hidden}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--font-size-sm,14px)}
.tbl th{text-align:left;padding:var(--space-2,8px) var(--space-3,12px);color:var(--color-text-tertiary);font-weight:var(--font-weight-medium,500);text-transform:uppercase;letter-spacing:.04em;font-size:var(--font-size-xs,12px)}
.tbl td{padding:var(--space-2,8px) var(--space-3,12px);border-top:1px solid var(--color-line-rule);vertical-align:middle}
.tbl tbody tr:hover{background:var(--color-ground-hover)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td.num{font-family:var(--font-data);font-variant-numeric:tabular-nums;color:var(--color-text-secondary);white-space:nowrap}

/* mono / url */
.mono{font-family:var(--font-data)}
.url{font-family:var(--font-data);font-size:var(--font-size-sm,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch;display:inline-block;vertical-align:bottom}
.u-auth{color:var(--color-text-secondary)}
.u-path{color:var(--color-text-link)}
.url-muted{color:var(--color-text-tertiary)}

/* badge base */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full,999px);font-size:var(--font-size-xs,12px);font-weight:var(--font-weight-medium,500);line-height:1.5}

/* method badges */
.m-get{background:var(--color-method-get-bg);color:var(--color-method-get-fg)}
.m-post{background:var(--color-method-post-bg);color:var(--color-method-post-fg)}
.m-put{background:var(--color-method-put-bg);color:var(--color-method-put-fg)}
.m-patch{background:var(--color-method-patch-bg);color:var(--color-method-patch-fg)}
.m-delete{background:var(--color-method-delete-bg);color:var(--color-method-delete-fg)}
.m-head{background:var(--color-method-head-bg);color:var(--color-method-head-fg)}
.m-options{background:var(--color-method-options-bg);color:var(--color-method-options-fg)}
.m-connect{background:var(--color-method-connect-bg);color:var(--color-method-connect-fg)}
.m-ws{background:var(--color-method-ws-bg);color:var(--color-method-ws-fg)}

<body>
<main id="app"></main>
<script>
// ——— shared runtime (keep in sync across widgets) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
// re-apply on host theme change if the host exposes an event
window.addEventListener?.('openai:set_globals', applyTheme);
// ——— widget render (unique per widget) ———
const KNOWN_METHODS = new Set(['get','post','put','patch','delete','head','options','connect']);
const MARK_COLORS = new Set(['red','orange','yellow','green','mint','teal','cyan','blue','indigo','purple','pink']);

function methodBadge(row){
  if (row.kind === 'websocket') return badge('m-ws', 'WS');
  const m = (row.method == null ? '' : String(row.method)).trim();
  if (!m) return badge('m-unknown', '—');
  const lower = m.toLowerCase();
  const cls = KNOWN_METHODS.has(lower) ? ('m-' + lower) : 'm-unknown';
  return badge(cls, m.toUpperCase());
}

function urlCell(row){
  const auth = row.authority == null ? '' : String(row.authority);
  const path = row.path == null ? '' : String(row.path);
  if (!auth && !path){
    return el('span', { class: 'url url-muted', text: row.kind === 'websocket' ? 'websocket' : '—' });
  }
  const span = el('span', { class: 'url', title: auth + path });
  if (auth) span.append(el('span', { class: 'u-auth', text: auth }));
  if (path) span.append(el('span', { class: 'u-path', text: path }));
  return span;
}

function statusCell(row){
  const s = row.status;
  if (s == null){
    const lower = (row.state == null ? '' : String(row.state)).toLowerCase();
    if (/(kill|drop|abort)/.test(lower)) return el('span', { class: 'st st-killed', text: 'killed' });
    return el('span', { class: 'st st-pending', text: 'pending' });
  }
  const n = Number(s);
  const klass = (n >= 100 && n < 600) ? ('st-' + Math.floor(n / 100) + 'xx') : '';
  return el('span', { class: ('st ' + klass).trim(), text: String(s) });
}

function fmtDuration(ms){
  if (ms == null) return '—';
  const n = Number(ms);
  if (!isFinite(n)) return '—';
  if (n < 1000) return n + ' ms';
  return (n / 1000).toFixed(n < 10000 ? 2 : 1) + ' s';
}

function stateNode(state){
  const s = (state == null ? '' : String(state)).trim();
  if (!s || s.toLowerCase() === 'none') return null;
  const lower = s.toLowerCase();
  let cls = 'state';
  if (lower.includes('agent')) cls += ' state-agent';
  else if (/(intercept|hold|held|pause|modif|drop|kill|edit|replay)/.test(lower)) cls += ' state-intercept';
  return el('span', { class: cls, text: s });
}

function stateCell(row){
  const box = el('div', { class: 'statecell' });
  const sn = stateNode(row.state);
  if (sn) box.append(sn);
  const marks = Array.isArray(row.marks) ? row.marks : [];
  for (const m of marks){
    const name = String(m);
    const lower = name.toLowerCase();
    if (MARK_COLORS.has(lower)) box.append(el('span', { class: 'mk mk-' + lower, title: name, 'aria-label': 'mark ' + name }));
    else box.append(el('span', { class: 'mark-chip', text: name }));
  }
  if (!box.childNodes.length) box.append(el('span', { class: 'url-muted', text: '—' }));
  return box;
}

function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const data = toolOutput();
  const rows = Array.isArray(data) ? data : ((data && data.flows) || []);
  const n = rows.length;

  app.append(el('header', { class: 'head' },
    el('h1', { text: 'Flows' }),
    el('span', { class: 'count', text: n + (n === 1 ? ' flow' : ' flows') })
  ));

  const card = el('section', { class: 'card' });
  if (!n){
    card.append(empty('No flows captured yet.'));
    app.append(card);
    return;
  }

  const thead = el('thead', null, el('tr', null,
    el('th', { text: 'Method' }),
    el('th', { text: 'URL' }),
    el('th', { text: 'Status' }),
    el('th', { class: 'num', text: 'Duration' }),
    el('th', { text: 'State' })
  ));
  const tbody = el('tbody');
  for (const row of rows){
    tbody.append(el('tr', null,
      el('td', null, methodBadge(row)),
      el('td', null, urlCell(row)),
      el('td', null, statusCell(row)),
      el('td', { class: 'num' }, fmtDuration(row.duration_ms)),
      el('td', null, stateCell(row))
    ));
  }
  card.append(el('table', { class: 'tbl' }, thead, tbody));
  app.append(card);
}

render();
window.addEventListener?.('openai:set_globals', render);
</script>
</body>
</html>
