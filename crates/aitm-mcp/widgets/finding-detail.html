<body>
<main id="app"></main>
<script>
// ——— shared runtime (identical in every widget) ———
const openai = window.openai || {};
function toolOutput(){ return (openai && openai.toolOutput) || {}; }
function applyTheme(){
  const t = (openai && openai.theme) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const kid of kids) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function badge(cls, label){ return el('span', { class: 'badge ' + cls, text: label }); }
function empty(msg){ return el('div', { class: 'empty', text: msg }); }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener?.('openai:set_globals', applyTheme);

// ——— widget render (unique per widget) ———
const SEV = new Set(['critical','high','medium','low','info']);
function sevClass(s){ return 'sev-' + (SEV.has(String(s)) ? s : 'info'); }

function kv(dl, label, value){
  if (value == null) return;
  dl.append(el('dt', { text: label }));
  const dd = el('dd');
  dd.append(value.nodeType ? value : document.createTextNode(String(value)));
  dl.append(dd);
}

function yesno(b){
  if (b === true) return el('span', { class: 'ok', text: 'yes' });
  if (b === false) return el('span', { class: 'bad', text: 'no' });
  return el('span', { class: 'muted', text: 'not run' });
}

function nonEmpty(s){ return (typeof s === 'string' && s.trim() !== '') ? s : null; }
const NIL_FLOW = '00000000-0000-0000-0000-000000000000';

function render(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const f = toolOutput();
  if (!f || typeof f !== 'object' || Object.keys(f).length === 0){
    app.append(empty('No finding to show.'));
    return;
  }

  // Header: severity badge + title + target
  const head = el('div', { class: 'head' });
  const top = el('div', { class: 'head-top' });
  if (f.severity != null) top.append(badge(sevClass(f.severity), String(f.severity)));
  if (nonEmpty(f.class)) top.append(badge('chip', String(f.class)));
  top.append(el('h1', { class: 'title', text: nonEmpty(f.title) || '(untitled finding)' }));
  head.append(top);
  if (nonEmpty(f.target)) head.append(el('div', { class: 'target mono', text: String(f.target) }));
  app.append(head);

  // Overview card: definition list of scalar fields
  const over = el('div', { class: 'card' });
  over.append(el('h2', { text: 'Overview' }));
  const dl = el('dl', { class: 'kv' });
  kv(dl, 'ID', nonEmpty(f.id) ? el('span', { class: 'mono', text: f.id }) : null);
  kv(dl, 'Class', nonEmpty(f.class));
  kv(dl, 'Severity', f.severity != null ? String(f.severity) : null);
  kv(dl, 'Discovered', nonEmpty(f.discovered_at));
  kv(dl, 'Origin', nonEmpty(f.origin));
  kv(dl, 'Client', nonEmpty(f.client_label));
  over.append(dl);
  app.append(over);

  // Reproduction card: pass / control-pass / run_at + the PoC reference (mono block)
  const repro = (f.reproduction && typeof f.reproduction === 'object') ? f.reproduction : {};
  const rc = el('div', { class: 'card' });
  rc.append(el('h2', { text: 'Reproduction' }));
  const rdl = el('dl', { class: 'kv' });
  kv(rdl, 'Passed', yesno(repro.passed));
  kv(rdl, 'Control passed', yesno(repro.control_passed));
  kv(rdl, 'Run at', nonEmpty(repro.run_at) || el('span', { class: 'muted', text: '—' }));
  rc.append(rdl);
  const pocRef = nonEmpty(f.poc_ref);
  if (pocRef) rc.append(el('pre', { class: 'mono block', text: pocRef }));
  app.append(rc);

  // Artifacts card
  const art = (f.artifacts && typeof f.artifacts === 'object') ? f.artifacts : {};
  const capture = (nonEmpty(art.finding_capture) && art.finding_capture !== NIL_FLOW) ? art.finding_capture : null;
  const pocPath = nonEmpty(art.poc_path);
  const shot = nonEmpty(art.screenshot_path);
  const ac = el('div', { class: 'card' });
  ac.append(el('h2', { text: 'Artifacts' }));
  if (capture || pocPath || shot){
    const adl = el('dl', { class: 'kv' });
    kv(adl, 'Capture flow', capture ? el('span', { class: 'mono', text: capture }) : null);
    kv(adl, 'PoC path', pocPath ? el('span', { class: 'mono', text: pocPath }) : null);
    kv(adl, 'Screenshot', shot ? el('span', { class: 'mono', text: shot }) : null);
    ac.append(adl);
  } else {
    ac.append(empty('No artifacts.'));
  }
  app.append(ac);

  // Linked flows card
  const flows = Array.isArray(f.flows) ? f.flows.filter(nonEmpty) : [];
  const fc = el('div', { class: 'card' });
  fc.append(el('h2', { text: 'Linked flows' }));
  if (flows.length){
    const ul = el('ul', { class: 'list' });
    for (const id of flows) ul.append(el('li', { class: 'mono', text: String(id) }));
    fc.append(ul);
  } else {
    fc.append(empty('No linked flows.'));
  }
  app.append(fc);

  // Notes card (optional)
  const notes = nonEmpty(f.notes);
  if (notes){
    const nc = el('div', { class: 'card' });
    nc.append(el('h2', { text: 'Notes' }));
    nc.append(el('div', { text: notes }));
    app.append(nc);
  }
}

render();
window.addEventListener?.('openai:set_globals', render);
</script>
</body>
</html>
