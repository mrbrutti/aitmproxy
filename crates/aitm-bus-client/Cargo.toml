[package]
name = "aitm-bus-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust client for the aitmproxy command bus (JSON-RPC 2.0 / MCP over newline-delimited lines): loopback TCP with token, or an in-process handler."

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
