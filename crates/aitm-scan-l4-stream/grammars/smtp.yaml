# SMTP, as much of it as the lane speaks (spec S3 row 7).
#
# One message is one command line. The server speaks first, so the host reads
# the 220 banner before it writes anything, and the campaign's prelude is a
# single EHLO. DATA, BDAT and the relay verbs are refused by `denylist.rs`,
# so a mail body is never opened and nothing is ever queued for delivery.
grammar: smtp
transport: tcp
default_ports: [25, 587]
reply: >
  The server opens with a 220 banner and answers every command with lines
  that begin with three ASCII digits. A space in the fourth column ends the
  reply; a hyphen continues it, so a 250-PIPELINING line is read on until a
  250 line arrives. 2xx and 3xx mean the server took the command, 4xx and
  5xx mean it refused it, and anything else is not an SMTP reply at all.
message:
  - name: command
    type: group
    fields:
      # The verb is matched case-insensitively and substituted from this list
      # by the type mutator. RCPT and AUTH are in the vocabulary because they
      # appear in captured traffic; the denylist decides whether one may be
      # written.
      - name: verb
        type: token
        one_of:
          [EHLO, HELO, MAIL, RCPT, NOOP, RSET, VRFY, EXPN, HELP, QUIT, STARTTLS]
      # NOOP has no argument and NOOP<SP> is a different line, so the
      # separator is a choice between one space and nothing at all. The space
      # is a mutable `delim`, the node S6.4's delim_remove, delim_dup and
      # delim_inject act on; the empty alternative is immutable, because there
      # is no separator there to remove, double or move.
      - name: sp
        type: choice
        fields:
          - { name: present, type: delim, value: " " }
          - { name: absent, type: bytes, size: 0, mutable: false }
      # Everything up to and including the CRLF, which belongs to the field.
      # This is the long-line point: SMTP line-length limits live here.
      - { name: arg, type: line, terminator: "\r\n" }
