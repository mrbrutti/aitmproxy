[package]
name = "aitm-testtarget"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hermetic, deliberately-vulnerable test target for authorized aitmproxy testing (M4). Grader-only manifest; no external network."
publish = false

# The standalone serve binary (AC-M4-17 operator path); the crate is otherwise a
# library the deterministic suites link in-process.
[[bin]]
name = "aitm-testtarget-serve"
path = "src/main.rs"

[dependencies]
aitm-findings.workspace = true
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
aitm-core.workspace = true
aitm-poc.workspace = true

[lints]
workspace = true
