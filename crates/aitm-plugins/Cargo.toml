[package]
name = "aitm-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "First-party feature plugins: capture, replay, intercept, mutate, scope, rate-limit."

[dependencies]
aitm-core.workspace = true
aitm-rules.workspace = true
anyhow.workspace = true
futures.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }

# The response-phase park test (tests/response_edit.rs) drives a real request
# through the HTTP module to prove the client receives the edited status, so it
# needs the protocol module plus a loopback TLS origin — the same harness Task 2
# used in aitm-proto-http. Test-only; no production dependency on a protocol crate.
[dev-dependencies]
aitm-proto-http.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
rcgen = { version = "0.14", features = ["x509-parser"] }

[lints]
workspace = true
