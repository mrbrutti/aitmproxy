[package]
name = "aitm-findings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Persistent, human-readable findings / run-history store and the findings.* commands (M4 Stream B)."

[dependencies]
aitm-core.workspace = true
aitm-poc.workspace = true
anyhow = "1"
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true
