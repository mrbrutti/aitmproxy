[package]
name = "aitm-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded headless browser driver over CDP, with SSRF guard and browser.* commands."

[dependencies]
aitm-core.workspace = true
anyhow.workspace = true
futures.workspace = true
# `process` (Task 19): the forked obscura runs as a managed child.
tokio = { workspace = true, features = ["rt", "sync", "time", "process"] }
# Named by the plan (Task 18): headless Chromium over CDP on tokio. No default
# features: the CDP socket is plain ws://localhost, and the optional Chromium
# fetcher (which the TLS features pull in) is not wanted.
chromiumoxide = { version = "0.9", default-features = false }
# `page.evaluate` yields `serde_json::Value`; converted to `aitm_core::Value`.
serde_json = "1"
# Child lifecycle logging (Task 20): `obscura started` with pid and port, the
# child's stdout/stderr at debug, the headless-ignored warning.
tracing.workspace = true
# URL authority parsing for the SSRF guard (already in the tree via chromiumoxide).
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
