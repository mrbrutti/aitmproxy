[package]
name = "aitm-plugin-passthrough"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-host TLS passthrough: the Arc-shared host list and the tls.passthrough.* command family, agent-gated."

[dependencies]
# The command/plugin traits, `CommandHost` (and its `Frontend`), `Registry`,
# plus the `ProtocolModule`/`NextLayerHint`/`ModuleCtx`/`ByteStream` seam the
# `PassthroughModule` plugs into.
aitm-core.workspace = true
anyhow.workspace = true
# `BoxFuture` for the `ProtocolModule::spawn` return type.
futures.workspace = true
# Resolving the upstream authority and copying bytes both ways with no MITM;
# `time` bounds the wait for the first byte inside an acknowledged tunnel.
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[dev-dependencies]
uuid.workspace = true
# `test-util` drives the first-byte timeout tests on a paused clock
# (`#[tokio::test(start_paused = true)]`), so 30 s pass in no wall time.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util", "net", "test-util"] }
# The real HTTP module (MITM side of the test) and its certificate authority.
aitm-proto-http.workspace = true
# A loopback TLS origin with its own cert, and the two client handshakes.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
