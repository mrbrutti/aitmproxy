[package]
name = "aitm-plugin-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aitm-core = { workspace = true }
aitm-findings = { workspace = true }
aitm-poc = { workspace = true }
# Scanner v2's shared data model: the `Lane` and `Check` traits whose handles the
# binary collects from the lane crates and hands to `ScannerPlugin` (spec D1).
aitm-scan-model = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
# JSON request bodies are parsed with the same serializer the rest of the tree
# uses; `url` is the WHATWG parser the embedded browser resolves links with, so
# the crawler's scope decisions and the browser's navigation agree byte for byte.
serde_json = "1"
# `time` arms the per-navigation timeout that enforces `time_budget`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
