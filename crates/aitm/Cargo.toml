[package]
name = "aitm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The aitmproxy binary: wires modules, plugins, and frontends from config."

[lib]
name = "aitm"
path = "src/lib.rs"

[[bin]]
name = "aitm"
path = "src/main.rs"

[dependencies]
aitm-core.workspace = true
aitm-plugin.workspace = true
aitm-proto-http.workspace = true
aitm-proto-ws.workspace = true
aitm-proto-l4.workspace = true
aitm-plugins.workspace = true
# M6 parity plugins (F9 WebSocket control, F10 sessions/HAR, F11 TLS passthrough,
# Map Local/Remote). Registered in `wire.rs`; `aitm-rules` is their shared matcher.
aitm-rules.workspace = true
aitm-plugin-wsctl.workspace = true
aitm-plugin-sessionio.workspace = true
aitm-plugin-passthrough.workspace = true
aitm-plugin-maprules.workspace = true
# The deterministic scanner (scan.discover): a command-only plugin registered in
# `wire.rs` so discovery auto-exposes over MCP/CLI/UI.
aitm-plugin-scanner.workspace = true
aitm-browser.workspace = true
aitm-ca.workspace = true
aitm-poc.workspace = true
# The persistent findings store; the binary registers `FindingsPlugin` so
# `findings.record`/`get`/`remove`/`list` reach the shipped bus.
aitm-findings.workspace = true
aitm-plugin-rhai.workspace = true
aitm-mcp.workspace = true
aitm-cli.workspace = true
# `aitm tui` embeds the proxy: the TUI runs in-process over `aitm-bus-client`'s
# `InProcessTransport` (TUI plan Task 4). Both are already in the tree.
aitm-tui.workspace = true
aitm-bus-client.workspace = true
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "process", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `aitm web` (F15): the static host and the `/bus` WebSocket bridge. hyper,
# hyper-util, http-body-util and bytes were already dev-dependencies here;
# tokio-tungstenite is the one aitm-proto-ws tests with. Nothing new enters
# Cargo.lock.
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
tokio-tungstenite = "0.28"
# Bridge token generation (two v4 UUIDs).
uuid.workspace = true

# macOS NE live-capture feeder, peer-auth seam (`macos_capture::peer_auth`): the
# core verifies the System Extension provider's code signature before it sends
# scope or feeds bytes. Security.framework is macOS-only, so every dependency here
# is behind the target cfg and nothing new links on Linux.
#   - `security-framework`: `os::macos::code_signing` (`SecCode` / `SecRequirement`).
#   - `libc`: `getsockopt(SOL_LOCAL, LOCAL_PEERTOKEN)` to read the peer audit token.
#   - `core-foundation`: `CFData`, the carrier the `GuestAttributes` audit-token
#     setter requires. `security-framework` pulls it in regardless (same `0.10`
#     it pins), so it adds no new crate to the tree; named here because it is
#     used directly.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"
libc = "0.2"

[dev-dependencies]
# The hermetic multi-vuln target the M4 browser-capture e2e drives (Task 14).
aitm-testtarget.workspace = true
# The TUI L4 CUA harness (Stage F, Task 17) drives the real key-input path
# (`aitm_tui::keys::map`) with crossterm `KeyEvent`s against a spawned core — the
# same crossterm the TUI itself reads keys through.
crossterm = { version = "0.29", features = ["event-stream"] }
# The HTTPS fixture behind the obscura MITM tests (M2 Task 24): same crates and
# features as aitm-proto-http, so nothing new enters the tree.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# PLAN-GAP DEVIATION (macOS NE live-feeder plan, Task 2): the workspace lint is
# `unsafe_code = "forbid"`, which no `#[allow]` can lift, and this crate must make
# exactly one `unsafe` libc call (`getsockopt(LOCAL_PEERTOKEN)` in
# `macos_capture::peer_auth`, which the plan calls for). Cargo cannot combine
# `workspace = true` with a per-crate override, so this crate restates the
# workspace lint set (today: `unsafe_code` only) at `deny`: still a hard error
# everywhere except the one `#[allow(unsafe_code)]` site. If the workspace gains
# more `[workspace.lints]`, mirror them here.
[lints.rust]
unsafe_code = "deny"
