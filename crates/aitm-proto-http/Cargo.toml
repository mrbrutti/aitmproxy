[package]
name = "aitm-proto-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP/1.1 protocol module: TLS MITM, certificate authority, sans-IO HTTP state machine."

[dependencies]
aitm-core.workspace = true
aitm-plugin.workspace = true
anyhow.workspace = true
futures.workspace = true
# HTTP/2 engine (the one `hyper` uses) + the `http` request/response/pseudo-header
# types it speaks. Versions are pinned here, not in the root manifest, per the
# proto-http sibling-session convention. (M7)
h2 = "0.4"
http = "1"
# The byte buffer type `h2`'s `SendStream`/`RecvStream` speak (re-exported by
# neither `h2` nor `http`); required to drive the h2 body frames. (M7 Task 2)
bytes = "1"
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
# Certificate authority: root generation + leaf minting, and the leaf cache.
rcgen = { version = "0.14", features = ["x509-parser"] }
moka = { version = "0.12", features = ["sync"] }
# TLS MITM. The `ring` provider is selected explicitly everywhere so feature
# unification with another crate's provider cannot change which one is used.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
# Root trust anchors for verifying upstream server certificates (R3).
webpki-roots = "0.26"
# Explicit certificate validity windows (rcgen uses `time` 0.3).
time = "0.3"
tracing.workspace = true
# Sniffing the upstream leaf's CN/SANs before minting an impersonating leaf.
x509-parser = "0.18"

# Unix-only: the `O_NOFOLLOW` constant for a TOCTOU-safe CA-key open (no unsafe).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid.workspace = true
# `test-util` (dev-only) pauses the clock for the read-timeout test of `serve`
# (`#[tokio::test(start_paused = true)]`), so the 30 s `READ_TIMEOUT` is
# reached in virtual time.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
# The real intercept plugin + its flow.intercept/mutate/resume/kill commands,
# driven through the registry so h2 interception is tested end to end against the
# same plugin set the chain dispatches through (M7 Task 3).
aitm-plugins.workspace = true
# The real Map Local/Remote plugin + its map.add command, driven through the
# registry so h2 Map Remote cross-origin is tested end to end against the same
# plugin + scope guard the chain dispatches through (M7 Task 4).
aitm-plugin-maprules.workspace = true
# The real session/flow-export plugin + its session.save/load + flow.export/import
# commands, driven through a registry so an h2 flow's session/HAR version tag is
# tested end to end over the actual serialization surface (M7 Task 6, AC-H2.11).
aitm-plugin-sessionio.workspace = true

[lints]
workspace = true
