# aitmproxy config — BLIND authorized pentest of local bWAPP (127.0.0.1:8088).
# Scope is deny-by-default and locked to the target host ONLY.
listen: "127.0.0.1:8080"

scope:
  entries:
    - "127.0.0.1:8088"
  # The on-camera agent widens scope with scope.add (Sensitive gate opened).
  allow_agent_widen: true

browser:
  engine: obscura
  # The SSRF-filtering listener the embedded obscura engine dials.
  proxy_addr: "127.0.0.1:8081"
  obscura:
    binary: "/Users/matt/Security/aitmproxy/.claude/worktrees/blind-pentest-bwapp-542fcf/target/release/obscura"
    start_timeout: 60
    stop_timeout: 5
  # Emulated (qemu) bWAPP is slow; give navigations room.
  nav_timeout: 90
  ssrf:
    block_private: true
    block_loopback: true
    # Lift the block only for the scoped loopback target.
    allow_if_in_scope: true

poc:
  dir: "/Users/matt/Security/aitmproxy/.claude/worktrees/blind-pentest-bwapp-542fcf/bwapp-assessment/pocs"
  out_dir: "/Users/matt/Security/aitmproxy/.claude/worktrees/blind-pentest-bwapp-542fcf/bwapp-assessment/out"

findings:
  dir: "/Users/matt/Security/aitmproxy/.claude/worktrees/blind-pentest-bwapp-542fcf/bwapp-assessment/findings"

mcp:
  transport:
    loopback_tcp:
      port: 8090
