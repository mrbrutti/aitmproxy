[workspace]
resolver = "2"
members = [
    "crates/aitm-core",
    "crates/aitm-rules",
    "crates/aitm-plugin",
    "crates/aitm-proto-http",
    "crates/aitm-proto-ws",
    "crates/aitm-proto-l4",
    "crates/aitm-proto-test",
    "crates/aitm-plugins",
    "crates/aitm-plugin-sessionio",
    "crates/aitm-plugin-passthrough",
    "crates/aitm-plugin-wsctl",
    "crates/aitm-plugin-maprules",
    "crates/aitm-plugin-scanner",
    "crates/aitm-browser",
    "crates/aitm-ca",
    "crates/aitm-poc",
    "crates/aitm-findings",
    "crates/aitm-plugin-rhai",
    "crates/aitm-mcp",
    "crates/aitm-cli",
    "crates/aitm-testtarget",
    "crates/aitm-bus-client",
    "crates/aitm-tui",
    "crates/aitm-peer-token",
    "crates/aitm-sysproxy",
    "crates/aitm-scan-model",
    "crates/aitm-scan-http",
    "crates/aitm-scan-checks-http",
    "crates/aitm-scan-ws",
    "crates/aitm-scan-l4-packet",
    "crates/aitm-scan-l4-stream",
    "crates/aitm",
]

[workspace.package]
version = "0.5.8"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

# Shared external dependency versions. Members opt in with `workspace = true`.
# Concrete versions chosen within the stack in docs/research/03-rust-proxy-stack.md.
[workspace.lints.rust]
# No crate in this workspace needs `unsafe`; forbid it so a future one is a
# deliberate, reviewed decision (platform spec unsafe policy).
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
indexmap = "2"
tokio = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Scanner v2 (spec 2026-10-31, Constraints "Dependencies"): track T1a declares every
# new external dependency once, here; each track's crates opt in with
# `workspace = true`. An entry no member inherits is never resolved and never enters
# `Cargo.lock`, so a declaration may land ahead of the track that consumes it.
blake3 = "1"                                        # T1b: issue dedupe key (D6)
bytes = "1"                                         # T4: WS frame payloads
hickory-proto = "0.26"                              # T6: DNS grammar (research 18 3.6: 0.26.3)
rand = "0.9"                                        # T6: L4 mutation RNG
rand_chacha = "0.9"                                 # T6: reproducible seeded RNG
regex = "1"                                         # T2: insertion-point ignore rules
serde = { version = "1", features = ["derive"] }    # model: wire types
serde_json = "1"                                    # model: wire types
serde_yaml = "0.9"                                  # model: operator-authored profiles
tokio-tungstenite = "0.28"                          # T4: WS lane client
tokio-util = { version = "0.7", features = ["rt"] } # T1b: job cancellation tokens
url = "2"                                           # T2: crawl URL normalisation

# Internal crates, referenced by path so the workspace builds in-tree.
aitm-core = { path = "crates/aitm-core" }
aitm-rules = { path = "crates/aitm-rules" }
aitm-plugin = { path = "crates/aitm-plugin" }
aitm-proto-http = { path = "crates/aitm-proto-http" }
aitm-proto-ws = { path = "crates/aitm-proto-ws" }
aitm-proto-l4 = { path = "crates/aitm-proto-l4" }
aitm-proto-test = { path = "crates/aitm-proto-test" }
aitm-plugins = { path = "crates/aitm-plugins" }
aitm-plugin-sessionio = { path = "crates/aitm-plugin-sessionio" }
aitm-plugin-passthrough = { path = "crates/aitm-plugin-passthrough" }
aitm-plugin-wsctl = { path = "crates/aitm-plugin-wsctl" }
aitm-plugin-maprules = { path = "crates/aitm-plugin-maprules" }
aitm-browser = { path = "crates/aitm-browser" }
aitm-ca = { path = "crates/aitm-ca" }
aitm-poc = { path = "crates/aitm-poc" }
aitm-findings = { path = "crates/aitm-findings" }
aitm-plugin-rhai = { path = "crates/aitm-plugin-rhai" }
aitm-mcp = { path = "crates/aitm-mcp" }
aitm-cli = { path = "crates/aitm-cli" }
aitm-testtarget = { path = "crates/aitm-testtarget" }
aitm-bus-client = { path = "crates/aitm-bus-client" }
aitm-tui = { path = "crates/aitm-tui" }
aitm-plugin-scanner = { path = "crates/aitm-plugin-scanner" }
aitm-peer-token = { path = "crates/aitm-peer-token" }
aitm-sysproxy = { path = "crates/aitm-sysproxy" }
aitm-scan-model = { path = "crates/aitm-scan-model" }
aitm-scan-http = { path = "crates/aitm-scan-http" }
aitm-scan-checks-http = { path = "crates/aitm-scan-checks-http" }
aitm-scan-ws = { path = "crates/aitm-scan-ws" }
aitm-scan-l4-packet = { path = "crates/aitm-scan-l4-packet" }
aitm-scan-l4-stream = { path = "crates/aitm-scan-l4-stream" }
